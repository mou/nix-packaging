name: "CI"
on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
      - uses: "DeterminateSystems/determinate-nix-action@v3"
      # `checks` mirrors `packages`, so this builds both derivations and runs
      # each upstream test suite in the sandbox.
      - run: "nix flake check -L"
      - run: "nix build -L .#yamldiff .#diffnest"
