name: "Publish to FlakeHub"
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
          # Rolling releases number themselves 0.1.<commit-count>, and
          # flakehub-push counts commits by walking local history. The default
          # shallow clone would make every push look like commit 1.
          fetch-depth: 0
      - uses: "DeterminateSystems/determinate-nix-action@v3"
      - uses: "DeterminateSystems/flakehub-push@main"
        with:
          visibility: "public"
          rolling: true
          name: "mou/nix-packaging"
          include-output-paths: true
